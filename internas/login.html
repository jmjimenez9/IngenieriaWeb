<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de la APP</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <div class="wrapper">
        <form action="#" method="post">
            <h1>LOGIN APP</h1>

            <div class="input-box">
                <input type="text" name="username" placeholder="Username" required>
                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required>
                <i class='bx bx-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password</a>
            </div>

            <button type="submit" class="btn">Login App</button>

            <div class="register-link">
                <p>Don't have account <a href="#">Register</a></p>
            </div>
        </form>
    </div>

    <div class="redes">
        <a href="#" class="caja"><i class='bx bxl-facebook'></i></a>
        <a href="#" class="caja"><i class='bx bxl-instagram'></i></a>
        <a href="#" class="caja"><i class='bx bxl-twitter'></i></a>
    </div>

</body>
</html>
